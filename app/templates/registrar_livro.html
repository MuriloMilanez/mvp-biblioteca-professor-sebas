{% extends 'base.html' %}
{% block title %}Registrar Livro - Biblioteca Municipal Professor Sebas{% endblock %}

{% block extra_css %}
<style>
    .form-grid { max-width: 540px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-top: 14px; margin-bottom: 6px; color: #334155; }
    input { width: 100%; padding: 11px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 15px; }
</style>
{% endblock %}

{% block content %}
<div class="hero-banner">
    <div class="hero-icon">📘</div>
    <div>
        <h1>Registrar Livro</h1>
        <p>Adicione novos exemplares ao acervo da Biblioteca Municipal Professor Sebas.</p>
    </div>
</div>

<div class="card">
    <form method="POST" class="form-grid">
        <label for="titulo">Título da Obra:</label>
        <input type="text" id="titulo" name="titulo" required placeholder="Ex: Capitães da Areia">

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" required placeholder="Ex: Jorge Amado">

        <label for="genero">Gênero:</label>
        <input type="text" id="genero" name="genero" required placeholder="Ex: Romance">

        <label for="quantidade">Quantidade de Exemplares:</label>
        <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-blue">✔ Confirmar Registro de Livro</button>
        </div>
    </form>
</div>
{% endblock %}
